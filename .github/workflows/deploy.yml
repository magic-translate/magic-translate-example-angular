name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prerendering translates the static pages, so the build calls the API.
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
        env:
          MAGIC_TRANSLATE_API_KEY: ${{ vars.MAGIC_TRANSLATE_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/magic-translate-example-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
